<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimonio - Personal & Family Finance</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding-bottom: 2rem;
    }
    .navbar {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .card-custom {
      background-color: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .balance-val {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -1px;
    }
    .text-income { color: #4ade80; }
    .text-expense { color: #f87171; }
    .btn-primary-custom {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      border: none;
      color: #fff;
      font-weight: 600;
    }
    .table-dark-custom {
      --bs-table-bg: transparent;
      --bs-table-color: var(--text-main);
      border-color: rgba(255,255,255,0.1);
    }
    .form-control, .form-select {
      background-color: #0f172a;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0f172a;
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
        <i class="bi bi-wallet2 text-info fs-3"></i>
        <span>Patrimonio</span>
      </a>
      <span class="badge bg-secondary rounded-pill">PWA Ready</span>
    </div>
  </nav>

  <div class="container">
    
    <!-- Dashboard Saldi -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card card-custom p-3 text-center">
          <span class="text-secondary small text-uppercase fw-semibold">Patrimonio Totale</span>
          <div id="totalBalance" class="balance-val text-info mt-1">€ 0.00</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card card-custom p-3 text-center">
          <span class="text-secondary small text-uppercase fw-semibold">Totale Entrate</span>
          <div id="totalIncome" class="balance-val text-income mt-1">€ 0.00</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card card-custom p-3 text-center">
          <span class="text-secondary small text-uppercase fw-semibold">Totale Uscite</span>
          <div id="totalExpense" class="balance-val text-expense mt-1">€ 0.00</div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Form Nuova Transazione -->
      <div class="col-lg-4">
        <div class="card card-custom p-4">
          <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle me-2"></i>Nuova Movimentazione</h5>
          <form id="txForm">
            <div class="mb-3">
              <label class="form-label small">Tipo</label>
              <select id="type" class="form-select" required>
                <option value="expense">Uscita (-)</option>
                <option value="income">Entrata (+)</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small">Importo (€)</label>
              <input type="number" step="0.01" id="amount" class="form-control" placeholder="0.00" required>
            </div>
            <div class="mb-3">
              <label class="form-label small">Descrizione</label>
              <input type="text" id="description" class="form-control" placeholder="es. Spesa supermercato" required>
            </div>
            <div class="mb-3">
              <label class="form-label small">Conto / Fondo</label>
              <select id="account" class="form-select" required>
                <option value="Conto Corrente">Conto Corrente</option>
                <option value="Carta Ricaricabile">Carta Ricaricabile</option>
                <option value="Fondo Risparmi">Fondo Risparmi</option>
                <option value="Contanti">Contanti</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small">Categoria</label>
              <select id="category" class="form-select" required>
                <option value="Casa & Utenze">Casa & Utenze</option>
                <option value="Alimentari & Spesa">Alimentari & Spesa</option>
                <option value="Auto & Trasporti">Auto & Trasporti</option>
                <option value="Svago & Viaggi">Svago & Viaggi</option>
                <option value="Stipendio & Income">Stipendio & Income</option>
                <option value="Altro">Altro</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small">Assegnato a</label>
              <select id="member" class="form-select" required>
                <option value="Personale">Personale</option>
                <option value="Famiglia">Famiglia</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2 rounded-3">Aggiungi Movimento</button>
          </form>
        </div>
      </div>

      <!-- Tabella Cronologia -->
      <div class="col-lg-8">
        <div class="card card-custom p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-list-columns-reverse me-2"></i>Cronologia Movimenti</h5>
            <button id="clearBtn" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash me-1"></i>Svuota</button>
          </div>
          <div class="table-responsive">
            <table class="table table-dark-custom align-middle">
              <thead>
                <tr class="text-secondary small">
                  <th>Data</th>
                  <th>Descrizione</th>
                  <th>Conto</th>
                  <th>Categoria</th>
                  <th>Soggetto</th>
                  <th class="text-end">Importo</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="txList">
                <!-- I movimenti verranno caricati qui via JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Inizializzazione dati salvati o array vuoto
    let transactions = JSON.parse(localStorage.getItem('patrimonio_txs')) || [];

    const txForm = document.getElementById('txForm');
    const txList = document.getElementById('txList');
    const totalBalance = document.getElementById('totalBalance');
    const totalIncome = document.getElementById('totalIncome');
    const totalExpense = document.getElementById('totalExpense');

    // Funzione per salvare nel localStorage
    function saveData() {
      localStorage.setItem('patrimonio_txs', JSON.stringify(transactions));
      updateUI();
    }

    // Calcolo saldi e aggiornamento interfaccia
    function updateUI() {
      txList.innerHTML = '';
      let incomeSum = 0;
      let expenseSum = 0;

      transactions.forEach((tx, index) => {
        const val = parseFloat(tx.amount);
        if (tx.type === 'income') incomeSum += val;
        else expenseSum += val;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="small text-secondary">${tx.date}</td>
          <td class="fw-semibold">${tx.description}</td>
          <td><span class="badge bg-dark border border-secondary">${tx.account}</span></td>
          <td><span class="badge bg-secondary">${tx.category}</span></td>
          <td><span class="badge bg-info text-dark">${tx.member}</span></td>
          <td class="text-end fw-bold ${tx.type === 'income' ? 'text-income' : 'text-expense'}">
            ${tx.type === 'income' ? '+' : '-'}€ ${val.toFixed(2)}
          </td>
          <td class="text-end">
            <button onclick="deleteTx(${index})" class="btn btn-link text-danger p-0 border-0"><i class="bi bi-x-circle"></i></button>
          </td>
        `;
        txList.appendChild(tr);
      });

      const netTotal = incomeSum - expenseSum;
      totalBalance.textContent = `€ ${netTotal.toFixed(2)}`;
      totalIncome.textContent = `€ ${incomeSum.toFixed(2)}`;
      totalExpense.textContent = `€ ${expenseSum.toFixed(2)}`;
    }

    // Gestione invio form
    txForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newTx = {
        type: document.getElementById('type').value,
        amount: document.getElementById('amount').value,
        description: document.getElementById('description').value,
        account: document.getElementById('account').value,
        category: document.getElementById('category').value,
        member: document.getElementById('member').value,
        date: new Date().toLocaleDateString('it-IT')
      };
      transactions.unshift(newTx);
      saveData();
      txForm.reset();
    });

    // Funzione per eliminare una singola transazione
    function deleteTx(index) {
      transactions.splice(index, 1);
      saveData();
    }

    // Svuota tutto
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Sei sicuro di voler cancellare tutti i dati registrati?')) {
        transactions = [];
        saveData();
      }
    });

    // Registrazione Service Worker per PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registrato!'))
        .catch(err => console.log('Errore Service Worker:', err));
    }

    // Primo avvio
    updateUI();
  </script>
</body>
</html>
