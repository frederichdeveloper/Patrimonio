<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimonio - Personal & Family Wealth</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
        <i class="bi bi-shield-lock-fill text-info fs-4"></i>
        <span>Patrimonio</span>
      </a>
      <div id="userSection" class="d-none align-items-center gap-3">
        <span id="userEmail" class="text-muted small"></span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm rounded-3"><i class="bi bi-box-arrow-right me-1"></i>Esci</button>
      </div>
    </div>
  </nav>

  <div class="container">

    <!-- SCHERMATA DI LOGIN / REGISTRAZIONE -->
    <div id="authContainer" class="row justify-content-center my-5">
      <div class="col-md-5">
        <div class="card card-premium p-4 text-center">
          <i class="bi bi-wallet2 text-info display-4 mb-3"></i>
          <h4 class="fw-bold mb-1">Accedi a Patrimonio</h4>
          <p class="text-muted small mb-4">Gestisci le tue finanze in modo sicuro e privato</p>

          <button id="googleLoginBtn" class="btn btn-google w-100 mb-3">
            <i class="bi bi-google"></i> Accedi con Google
          </button>

          <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1 border-secondary">
            <span class="px-2 text-muted small">oppure con email</span>
            <hr class="flex-grow-1 border-secondary">
          </div>

          <form id="authForm">
            <div class="mb-3 text-start">
              <label class="form-label small text-muted">Email</label>
              <input type="email" id="authEmail" class="form-control" placeholder="nome@esempio.it" required>
            </div>
            <div class="mb-3 text-start">
              <label class="form-label small text-muted">Password</label>
              <input type="password" id="authPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" id="loginBtn" class="btn btn-premium">Accedi</button>
              <button type="button" id="signUpBtn" class="btn btn-outline-secondary rounded-3 text-light">Registrati</button>
            </div>
          </form>
          <div id="authError" class="text-danger small mt-3"></div>
        </div>
      </div>
    </div>

    <!-- DASHBOARD PRINCIPALE (Nascosta prima del login) -->
    <div id="appDashboard" class="d-none">
      <!-- Saldi -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card card-premium p-4 text-center">
            <span class="balance-title">Patrimonio Totale</span>
            <div id="totalBalance" class="balance-value text-info mt-1">€ 0.00</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card card-premium p-4 text-center">
            <span class="balance-title">Totale Entrate</span>
            <div id="totalIncome" class="balance-value text-income mt-1">€ 0.00</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card card-premium p-4 text-center">
            <span class="balance-title">Totale Uscite</span>
            <div id="totalExpense" class="balance-value text-expense mt-1">€ 0.00</div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <!-- Form Movimentazione -->
        <div class="col-lg-4">
          <div class="card card-premium p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle me-2 text-info"></i>Nuovo Movimento</h5>
            <form id="txForm">
              <div class="mb-3">
                <label class="form-label small text-muted">Tipo</label>
                <select id="type" class="form-select" required>
                  <option value="expense">Uscita (-)</option>
                  <option value="income">Entrata (+)</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label small text-muted">Importo (€)</label>
                <input type="number" step="0.01" id="amount" class="form-control" placeholder="0.00" required>
              </div>
              <div class="mb-3">
                <label class="form-label small text-muted">Descrizione</label>
                <input type="text" id="description" class="form-control" placeholder="es. Stipendio, Spesa..." required>
              </div>
              <div class="mb-3">
                <label class="form-label small text-muted">Conto / Fondo</label>
                <select id="account" class="form-select" required>
                  <option value="Conto Corrente">Conto Corrente</option>
                  <option value="Carta Ricaricabile">Carta Ricaricabile</option>
                  <option value="Fondo Risparmi">Fondo Risparmi</option>
                  <option value="Contanti">Contanti</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label small text-muted">Categoria</label>
                <select id="category" class="form-select" required>
                  <option value="Casa & Utenze">Casa & Utenze</option>
                  <option value="Alimentari & Spesa">Alimentari & Spesa</option>
                  <option value="Auto & Trasporti">Auto & Trasporti</option>
                  <option value="Svago & Viaggi">Svago & Viaggi</option>
                  <option value="Stipendio">Stipendio</option>
                  <option value="Altro">Altro</option>
                </select>
              </div>
              <button type="submit" class="btn btn-premium w-100 py-2 mt-2">Salva Movimento</button>
            </form>
          </div>
        </div>

        <!-- Cronologia -->
        <div class="col-lg-8">
          <div class="card card-premium p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-list-columns-reverse me-2 text-info"></i>Cronologia Movimenti</h5>
            <div class="table-responsive">
              <table class="table table-custom align-middle">
                <thead>
                  <tr class="text-muted small">
                    <th>Data</th>
                    <th>Descrizione</th>
                    <th>Conto</th>
                    <th>Categoria</th>
                    <th class="text-end">Importo</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="txList">
                  <!-- Movimenti inseriti dinamicamente -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Script Firebase & App Logic -->
  <script type="module" src="app.js"></script>
</body>
</html>
